<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>토질 틈틈봇</title><style>
:root{
  --bg:#faf8f4;--card:#fff;--ink:#1b1d21;--sub:#5f6672;--line:#e2ddd4;
  --blue:#1f5fa8;--blueF:#e8f0f9;--rust:#a8452a;--rustF:#fbeee9;
  --ok:#2c6e49;--okF:#e7f2ea;--gold:#8a6a1f;--goldF:#fbf3dd;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14161a;--card:#1c1f25;--ink:#e8e6e1;--sub:#9aa2ae;--line:#2e333c;
  --blue:#6fa8e8;--blueF:#1a2735;--rust:#e08b6c;--rustF:#2e211c;
  --ok:#6fc08e;--okF:#18271e;--gold:#d6b25e;--goldF:#2a2417;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%;
  min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#1e3450,#2c5782);color:#fff;padding:12px 16px 10px;flex-shrink:0}
header .row{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:1.05rem;letter-spacing:-.01em}
header .st{font-family:var(--mono);font-size:.76rem;opacity:.9;margin-left:auto}
.pbar{max-width:820px;margin:8px auto 0;height:5px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:#8ec9a4;width:0;transition:width .3s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 14px}
.card{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:26px 26px 22px;box-shadow:0 6px 26px rgba(0,0,0,.07)}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bdg{font-family:var(--mono);font-size:.68rem;font-weight:700;border-radius:5px;padding:2px 8px}
.b-t{background:var(--blueF);color:var(--blue)}
.b-s{background:var(--rustF);color:var(--rust)}
.b-g{background:var(--okF);color:var(--ok)}
.b-c{background:var(--goldF);color:var(--gold)}
.b-n{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.q{font-size:1.3rem;font-weight:700;line-height:1.6;margin:0 0 6px}
.hint{font-size:.82rem;color:var(--sub);font-family:var(--mono)}
.timer{font-family:var(--mono);font-size:2.6rem;font-weight:700;color:var(--blue);
  text-align:center;margin:22px 0 8px;letter-spacing:.05em}
.timer.go{color:var(--ok)}
.a{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;font-size:1.02rem;line-height:1.8}
.a b{color:var(--rust)}
.a .ln{margin:5px 0}
.a table{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:6px}
.a td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.a tr:first-child td{background:var(--blueF);color:var(--blue);font-weight:700}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts button{flex:1;min-width:130px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:14px 16px;font-size:1rem;font-family:var(--sans);font-weight:700;cursor:pointer}
.acts .show{background:var(--blue);border-color:var(--blue);color:#fff}
.acts .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.acts .mid{background:var(--gold);border-color:var(--gold);color:#fff}
.acts .ng{background:var(--rust);border-color:var(--rust);color:#fff}
.acts .skip{font-weight:400;color:var(--sub);flex:0 0 auto;min-width:0;padding:14px 18px}
footer{flex-shrink:0;padding:10px 14px 16px;border-top:1px solid var(--line);background:var(--card)}
footer .row{max-width:820px;margin:0 auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:16px;
  padding:5px 12px;font-size:.78rem;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.cnt{font-family:var(--mono);font-size:.75rem;color:var(--sub);margin-left:auto}
.kb{font-family:var(--mono);font-size:.7rem;color:var(--sub);opacity:.8}
.done{text-align:center;padding:40px 20px}
.done h2{font-size:1.4rem;margin:0 0 10px}
.done p{color:var(--sub)}
@media(max-width:560px){
  .card{padding:20px 18px 18px;border-radius:13px}
  .q{font-size:1.15rem} .timer{font-size:2.1rem;margin:16px 0 6px}
  .acts button{min-width:0;font-size:.94rem;padding:13px 10px}
  .kb{display:none}
}

s="chip" data-f="sec" data-v="에이징 — 시간이 흙을 과압밀로 만든다">에이징</button><button class="chip" data-f="sec" data-v="실제 기출 — 개념 묶음별 (중복 묶고 + 넣을 것)">실제 기출</button><button class="chip" onclick="resetAll()">기록 초기화</button><span class="cnt" id="cnt"></span></div></footer><script>
var CARDS = [{"id": "01-R01", "ch": "제1장 흙의 성질", "sec": "이 장의 척추 — 중력이냐 전기력이냐", "type": "recall", "q": "흙이 압축되는 것은 입자가 찌그러져서입니까?", "a": "아닙니다. 흙입자도 물도 **비압축성**입니다. 압축되는 건 **사이의 공기가 빠지고 물이 빠져서**입니다. 이것이 **압밀의 본질**이고, 전단파괴도 입자가 잘려서가 아니라 **입자들이 서로 미끄러져 자리를 바꿔서**입니다.", "tag": "인출", "src": "s0"}, {"id": "01-S02", "ch": "제1장 흙의 성질", "sec": "이 장의 척추 — 중력이냐 전기력이냐", "type": "sal", "q": "1장을 한 줄로 요약하면? (사질토 vs 점성토)", "a": "**사질토 = 중력 지배** → 입자의 크기·모양이 구조를 정하고, 힘은 **내부마찰각 φ**.|\n**점성토 = 전기력 지배** → 점토광물 종류와 **이중층수 두께**가 구조를 정하고, 힘은 **점착력 c**.\n답안에서 이 **대비축**으로 쪼개는 순간 뼈대는 완성입니다. 1교시 10점 용어도 이걸로 만점 구조가 나옵니다.", "tag": "골격", "src": "s0"}, {"id": "01-R03", "ch": "제1장 흙의 성질", "sec": "흙의 생성 — 잔적토와 퇴적토", "type": "recall", "q": "홍적층과 충적층은 압밀 거동이 어떻게 다릅니까?", "a": "**홍적층**은 200만~1만년 전 퇴적으로 오래 눌려 **과압밀(OC) 거동**, **충적층**은 1만년 이후라 덜 눌려 **정규압밀(NC) 거동**입니다. 생성 시기 하나가 압밀 거동을 결정합니다.", "tag": "인출", "src": "s1"}, {"id": "01-S04", "ch": "제1장 흙의 성질", "sec": "흙의 생성 — 잔적토와 퇴적토", "type": "sal", "q": "여기가 갈림길 — 설명해 보세요", "a": "**물리적 풍화만** → 원 광물 유지 → **사질토**  /  **화학적 풍화** → 광물이 바뀜 → **점토광물 탄생** → **점성토**\n즉 **점토광물의 기원 = 화학적 풍화**. 이 한 줄이 다음 절로 그대로 이어집니다.", "tag": "살", "src": "s1"}, {"id": "01-S05", "ch": "제1장 흙의 성질", "sec": "흙의 생성 — 잔적토와 퇴적토", "type": "sal", "q": "지질시대 = 압밀거동 — 설명해 보세요", "a": "**홍적세**(200만~1만년 전) → 홍적층 → 오래 눌림 → **OC 거동(과압밀)**|\n**충적세**(1만년 전 이후) → 충적층 → 덜 눌림 → **NC 거동(정규압밀)**\n**[발판]** STARVIEW = 메콩 삼각주 **충적층 → NC 해성점토**. 그래서 PVD·진공재하로 압밀을 강제로 앞당긴 것. 마곡·신촌 = 화강풍화토+편마암.|\n4교시에서 **\"본 현장은 충적층으로 NC 거동을 보이므로\"** 한 문장 깔면 발판이 삽니다.", "tag": "살", "src": "s1"}, {"id": "01-R06", "ch": "제1장 흙의 성질", "sec": "점토광물 — 기본단위·3종·동형치환", "type": "recall", "q": "몬모릴로나이트의 표면적이 800 m²/g이라는 게 왜 중요합니까?", "a": "표면적이 크면 **물을 붙잡을 자리가 많아** 확산이중층이 두꺼워지고, 반발력이 커져 **이산·팽창**으로 갑니다. 이 인과사슬 하나로 **활성도·팽창성·예민비**가 전부 설명됩니다.", "tag": "인출", "src": "s2"}, {"id": "01-S07", "ch": "제1장 흙의 성질", "sec": "점토광물 — 기본단위·3종·동형치환", "type": "sal", "q": "표면적 숫자가 전부를 설명한다 — 설명해 보세요", "a": "Kaolinite **15** → Illite **80** → Montmorillonite **800** m²/g  ≈ ×10씩", "tag": "살", "src": "s2"}, {"id": "01-S08", "ch": "제1장 흙의 성질", "sec": "점토광물 — 기본단위·3종·동형치환", "type": "sal", "q": "이 구분이 통일분류를 설명한다 — 설명해 보세요", "a": "**크기로 나눈 점토와 성질로 나눈 점토가 다르다.** 그래서 통일분류는 세립토를 **입도가 아니라 소성도(LL·PI)로** 나눈다. 0.075mm 아래로 내려가면 **크기를 아무리 정밀하게 재도 거동을 알 수 없고**, 그것을 대신 알려주는 것이 연경도이기 때문이다. 답안에서 **\"세립토를 왜 소성도로 분류하는가\"**를 물으면 이 한 줄이 정답이다.", "tag": "살", "src": "s2"}, {"id": "01-S09", "ch": "제1장 흙의 성질", "sec": "점토광물 — 기본단위·3종·동형치환", "type": "sal", "q": "이 비유가 답안에서 하는 일 — 설명해 보세요", "a": "이인모는 **800 m²/g**, 백영식은 **1,000 m²/g**으로 조금 다르지만 자릿수는 같다. 답안에는 **\"수백~1,000 m²/g\"**로 쓰고 **축구장 비유를 한 줄 덧붙이면** 채점자에게 남는다. 그리고 이 숫자가 **왜 점성토는 전기력이 중력을 이기는가**에 대한 답이다 — 입자가 얇은 판이 되면 **같은 무게에 표면적이 폭발**하고, 표면적이 크면 **표면 전기력이 자중을 압도**한다.", "tag": "살", "src": "s2"}, {"id": "01-T10", "ch": "제1장 흙의 성질", "sec": "점토광물 — 기본단위·3종·동형치환", "type": "table", "q": "점토광물 — 기본단위·3종·동형치환 — 비교표를 채워 보세요 (구조 vs 층간 결합)", "a": "**광물 | 구조 | 층간 결합 | 표면적 | 안정성 | 활성도**|| Kaolinite | 1:1 | 수소결합 | 15 m²/g | 매우 안정 | 0.3~0.5 ||| Illite | 2:1 | K⁺ 이온 | 80 m²/g | 중간 | 0.5~1.3 ||| Montmorillonite | 2:1 | nH₂O + 치환성 양이온 | 800 m²/g | 매우 불안정 | 1.5~7 |", "tag": "비교표", "src": "s2"}, {"id": "01-R11", "ch": "제1장 흙의 성질", "sec": "확산이중층과 흡착수", "type": "recall", "q": "염분이 있으면 확산이중층은 두꺼워집니까, 얇아집니까?", "a": "**얇아집니다.** 전해질 농도가 높으면 이중층이 압축되기 때문입니다. 그래서 해성점토는 반발력이 줄어 **면모구조**가 되고, 이것이 나중에 **Quick clay**의 출발점이 됩니다.", "tag": "인출", "src": "s3"}, {"id": "01-R12", "ch": "제1장 흙의 성질", "sec": "확산이중층과 흡착수", "type": "recall", "q": "석회로 팽창토를 안정처리하면 왜 팽창이 줄어듭니까?", "a": "석회의 **Ca²⁺(2가 양이온)**이 기존 1가 양이온을 치환하면서 **확산이중층을 얇게** 만들기 때문입니다. 이중층이 얇아지면 반발력이 줄고 물을 붙잡는 힘도 줄어 **팽창성이 감소**합니다.", "tag": "인출", "src": "s3"}, {"id": "01-R13", "ch": "제1장 흙의 성질", "sec": "확산이중층과 흡착수", "type": "recall", "q": "함수비 시험을 150℃에서 하면 무엇이 잘못됩니까?", "a": "**흡착수까지 증발**합니다. 흡착수는 **토립자의 일부**로 봐야 하는데 그것까지 물로 세어버리므로 **함수비가 과대평가**되고, 이후 간극비·포화도·단위중량 계산이 전부 틀어집니다.", "tag": "인출", "src": "s3"}, {"id": "01-S14", "ch": "제1장 흙의 성질", "sec": "확산이중층과 흡착수", "type": "sal", "q": "인과사슬 한 줄 — 설명해 보세요", "a": "**동형치환 → 표면 (−)대전 → 양이온 흡인 → 양이온이 dipole 물을 흡인 → 점토 주위에 움직이지 못하는 물층 = 이중층수**\n구성: **흡착수(≈**10Å**, 강결합·고체에 가까움) → 확산수(≈**200Å**까지, 약결합·유동적, 전기력 영향권) → 자유수(영향권 밖)**\n**그리고 시험이 진짜 묻는 건 그 다음**: 이중층이 **두꺼우면 반발력↑ → 이산**, **얇으면 인력 승 → 면모**. 바로 다음 절입니다.\n이중층 **두께 증가** 인자 ▲: 이온가↓ · 전해질 농도↓ · 유전상수↑  ⟷  **염분(전해질)이 있으면 이중층이 얇아짐**", "tag": "살", "src": "s3"}, {"id": "01-S15", "ch": "제1장 흙의 성질", "sec": "확산이중층과 흡착수", "type": "sal", "q": "이 네 인자가 전부 실무로 간다 — 설명해 보세요", "a": "**①농도** → 해수(고농도)는 이중층을 얇게 → **면모구조** → 담수로 씻기면(Leaching) 반대로 → **Quick clay**. **②가수** → Ca²⁺(2가)로 치환하면 이중층이 얇아짐 → **석회 안정처리**가 팽창토를 잡는 원리가 이것이다. Na-몬모릴로나이트(1가)의 활성도가 4~7인데 Ca-몬모릴로나이트(2가)는 1.5인 이유도 같다. **③④**는 시험 조건 통제용.", "tag": "살", "src": "s3"}, {"id": "01-S16", "ch": "제1장 흙의 성질", "sec": "확산이중층과 흡착수", "type": "sal", "q": "이 한 문단이 세 곳에서 회수된다 — 설명해 보세요", "a": "**① 함수비 시험** — \"왜 105~110℃인가\"에 답할 수 있는 사람이 드물다. 이 한 줄이 변별력이다.|**② 압밀** — 흡착수가 **토립자의 일부**라는 것은, 압밀로 **빠져나가는 물은 자유수뿐**이라는 뜻이다. 그래서 아무리 오래 압밀해도 간극비가 0으로 가지 않고, 점토가 사질토보다 **압밀이 느리고 오래 간다**.|**③ 동결** — 흡착수가 0℃에 얼지 않으므로 동결 시 **자유수만 얼면서 흡착수를 빨아들여** 아이스렌즈가 자란다. **동상(Frost heave)의 메커니즘**이 여기서 나온다.", "tag": "살", "src": "s3"}, {"id": "01-R17", "ch": "제1장 흙의 성질", "sec": "면모구조 vs 이산구조 ★ 필수논점", "type": "recall", "q": "면모구조와 이산구조 중 압축성이 작은 쪽은?", "a": "**압력 수준에 따라 역전됩니다.** 낮은 압력에서는 면모가 결합력 때문에 압축성이 작지만, **높은 압력에서는 결합이 깨지면서 성긴 구조가 무너져 면모가 오히려 압축성이 큽니다.** 이 역전을 안 쓰면 반쪽 답안입니다.", "tag": "인출", "src": "s4"}, {"id": "01-S18", "ch": "제1장 흙의 성질", "sec": "면모구조 vs 이산구조 ★ 필수논점", "type": "sal", "q": "여기가 만점 갈림선 — 설명해 보세요", "a": "면모구조 (Flocculant)이산구조 (Dispersive)\n**지배력****인력** 우세 (edge–face + Van der Waals)**반발력** 우세\n**이중층 두께**얇다두껍다\n**형성****해수 퇴적 · 건조측 다짐****담수 퇴적 · 교란 · 습윤측 다짐**\n**배열**단부–면 엉킴(무작위)면–면 평행\n**강도****크다**작다\n**압축성**낮은 압력 **小** / 높은 압력 **大**낮은 압력 大 / 높은 압력 小\n**투수성****크다**(구멍 많음)작다(차곡차곡)", "tag": "살", "src": "s4"}, {"id": "01-T19", "ch": "제1장 흙의 성질", "sec": "면모구조 vs 이산구조 ★ 필수논점", "type": "table", "q": "면모구조 vs 이산구조 ★ 필수논점 — 비교표를 채워 보세요 (면모구조 (Flocculant) vs 이산구조 (Dispersive))", "a": "** | 면모구조 (Flocculant) | 이산구조 (Dispersive)**|| 지배력 | 인력 우세 (edge–face + Van der Waals) | 반발력 우세 ||| 이중층 두께 | 얇다 | 두껍다 ||| 형성 | 해수 퇴적 · 건조측 다짐 | 담수 퇴적 · 교란 · 습윤측 다짐 ||| 배열 | 단부–면 엉킴(무작위) | 면–면 평행 ||| 강도 | 크다 | 작다 ||| 압축성 | 낮은 압력 小 / 높은 압력 大 | 낮은 압력 大 / 높은 압력 小 ||| 투수성 | 크다(구멍 많음) | 작다(차곡차곡) |", "tag": "비교표", "src": "s4"}, {"id": "01-R20", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "recall", "q": "액성지수와 과압밀비는 어떤 관계입니까?", "a": "**반비례**입니다. 과압밀 점토는 과거에 더 큰 하중을 받아 간극비와 함수비가 작으므로 **LI가 작고 OCR은 큽니다**. 정규압밀은 반대로 LI가 1 부근이고 OCR은 1입니다.", "tag": "인출", "src": "s5"}, {"id": "01-R21", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "recall", "q": "측정 결과 LL=40, PI=32가 나왔습니다. 어떻게 판단합니까?", "a": "U선은 PI = 0.9(40−8) = **28.8**입니다. 측정값 32가 **U선을 넘었으므로 시험 오류**입니다. 재시험해야 합니다.", "tag": "인출", "src": "s5"}, {"id": "01-R22", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "recall", "q": "액성지수와 상대밀도의 공통 구조를 한 문장으로 말하면?", "a": "둘 다 **양 극단 사이에서 현재 상태가 어디에 있는지를 0~1로 정규화**한 지표입니다. LI는 **PL~LL 사이의 함수비**, Dr은 **e_min~e_max 사이의 간극비**를 봅니다.", "tag": "인출", "src": "s5"}, {"id": "01-S23", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "sal", "q": "LI ↔ OCR 반비례 — 설명해 보세요", "a": "이인모는 정의까지만 주므로 **연결은 인과로 채웁니다**:\n**OC 점토** = 과거에 더 큰 하중을 받아 이미 눌림 → **e 작음 → w 작음 → LI 작음**|\n**NC 점토** = 눌린 적 없음 → **e 큼 → w 큼 → LI 큼**\n\n**NC**: LI ≈ 1 이상, OCR = 1   |   **OC**: LI ≈ 0 이하, OCR > 1   ⟹  **LI ∝ 1/OCR**", "tag": "살", "src": "s5"}, {"id": "01-S24", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "sal", "q": "숫자까지 외울 것 — 설명해 보세요", "a": "**A선** PI = 0.73(LL − 20)  ·  **U선** PI = 0.9(LL − 8)  ·  **B선** LL = 50", "tag": "살", "src": "s5"}, {"id": "01-S25", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "sal", "q": "소성도표의 두 축이 각각 무엇을 말하나 — 설명해 보세요", "a": "**세로(PI) = 점토냐 실트냐** — 같은 LL에서 PI가 크면 점토. 그래서 **A선이 C와 M을 가른다**.|**가로(LL) = 압축성이 크냐 작으냐** — 같은 PI에서 LL이 크면 압축성이 크다. 그래서 **LL=50이 H와 L을 가른다**.|즉 **소성도표 한 장에 '무슨 흙인가'와 '얼마나 압축되나'가 동시에** 들어 있다. 이 두 문장을 답안에 쓰면 도표를 이해했다는 신호가 된다.|압축성 구분 : **LL > 50 큰 압축성 · 30 < LL ≤ 50 중간 · LL ≤ 30 작은 압축성**", "tag": "살", "src": "s5"}, {"id": "01-S26", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "sal", "q": "U선(Upper line)의 쓸모 — 설명해 보세요", "a": "**U선 : PI = 0.9(LL − 8)**. 이인모는 **\"이 이상의 소성지수를 가진 점토는 지구상에 없다\"**고 명시한다. 즉 U선은 분류선이 아니라 **시험 검증선**이다. 측정값이 U선 위로 나오면 **시험 오류**이니 재시험해야 한다. 답안에서 A선만 쓰는 사람이 대부분이므로, **U선을 함께 쓰면 변별력이 생긴다**.", "tag": "살", "src": "s5"}, {"id": "01-S27", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "sal", "q": "액성지수와 상대밀도는 같은 구조다 (백영식 그림 1.12) ★★ — 설명해 보세요", "a": "백영식은 이 둘을 **나란히 놓고 비교**한다. 이게 1장 척추를 한 단계 더 밀어붙인 대목이다.|**LI = (w − PL) / (LL − PL)** — **PL을 기준**으로 w가 **LL에 접근한 정도**|**Dr = (e_max − e) / (e_max − e_min)** — **e_max를 기준**으로 e가 **e_min에 접근한 정도**|즉 **점성토의 LI와 사질토의 Dr은 형태가 똑같은 정규화 지표**다. 재는 대상만 함수비냐 간극비냐로 다를 뿐이다.|**답안 활용** — \"사질토는 상대밀도, 점성토는 연경도\"라고만 쓰면 나열이지만, **\"둘 다 양 극단 사이 어디에 있는가를 나타내는 같은 구조의 지표\"**라고 쓰면 이해했다는 신호가 된다.", "tag": "살", "src": "s5"}, {"id": "01-S28", "ch": "제1장 흙의 성질", "sec": "애터버그 한계 · PI · LI · 소성도", "type": "sal", "q": "컨시스턴시지수는 측방유동 판정에 쓰인다 — 설명해 보세요", "a": "**독일 기준**은 연경지수 **Ic = (LL − w)/PI**로 측방유동을 판정한다(**101-3-1**). **Ic = 1이면 현장 함수비 = 소성한계**이고, Ic가 작을수록 액체에 가까워 **측방유동 위험이 크다**. 즉 1장의 지수가 **8장 연약지반 답안에서 그대로 회수**된다.", "tag": "살", "src": "s5"}, {"id": "01-R29", "ch": "제1장 흙의 성질", "sec": "활성도 ★ 필수논점", "type": "recall", "q": "활성도가 큰 흙이 팽창성도 큰 이유를 한 줄로 이으면?", "a": "활성도가 크다 = 같은 점토 함유율에서 **소성지수가 크다** = 흡착수를 많이 붙잡는다 = **비표면적이 크다** = 몬모릴로나이트 계열이다. 그래서 물을 만나면 층간으로 물이 들어가 **팽창**합니다.", "tag": "인출", "src": "s6"}, {"id": "01-S30", "ch": "제1장 흙의 성질", "sec": "활성도 ★ 필수논점", "type": "sal", "q": "활성도 만점 4요소 — 설명해 보세요", "a": "**①** 정의식 + 그래프(원점 지나는 직선, 기울기 = A)|\n**②** 구간값 **0.75 / 1.25** 와 대응 광물(Kaol / Illite / Mont)|\n**③ 왜 그런가** — A↑ = 같은 점토함유율에서 PI↑ = 흡착수를 많이 붙잡음 = **비표면적이 큼**. §02의 **800 m²/g**이 여기서 회수됩니다.|\n**④ 활용** — **간편 판별법 = 활성도**, **정밀 판별법 = XRD(X선 회절) · SEM**. + **팽창성 판정**(→ §08)", "tag": "살", "src": "s6"}, {"id": "01-S31", "ch": "제1장 흙의 성질", "sec": "활성도 ★ 필수논점", "type": "sal", "q": "같은 몬모릴로나이트인데 왜 4~7과 1.5로 갈리나 — 설명해 보세요", "a": "**층간 양이온의 가수(價數)** 때문이다. **Na⁺(1가)**는 이중층을 두껍게 두어 활성도 **4~7**, **Ca²⁺(2가)**는 적은 수로 음전하를 중화해 이중층이 얇아지므로 **1.5**다. §03에서 본 **\"이온 가수가 클수록 이중층이 얇아진다\"**가 여기서 숫자로 회수된다.|**실무 직결** — **석회(Ca²⁺) 안정처리**가 팽창토를 잡는 이유가 이 한 줄이다. Na형을 Ca형으로 바꾸면 활성도가 **4~7 → 1.5로 떨어진다.**", "tag": "살", "src": "s6"}, {"id": "01-T32", "ch": "제1장 흙의 성질", "sec": "활성도 ★ 필수논점", "type": "table", "q": "활성도 ★ 필수논점 — 비교표를 채워 보세요 (활성도 vs 점토광물)", "a": "**점토광물 | 활성도 | 점토광물 | 활성도**|| Na-montmorillonite | 4 ~ 7 | Attapulgite | 0.5~1.2 ||| Ca-montmorillonite | 1.5 | Allophane | 0.5~1.2 ||| Illite | 0.5 ~ 1.3 | Mica (muscovite) | 0.2 ||| Kaolinite | 0.3 ~ 0.5 | Calcite | 0.2 ||| Halloysite (탈수) | 0.5 | Quartz | 0 ||| Halloysite (수화) | 0.1 | Skempton(1953) · Mitchell(1976) · 백영식 표 1.2 |", "tag": "비교표", "src": "s6"}, {"id": "01-R33", "ch": "제1장 흙의 성질", "sec": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점", "type": "recall", "q": "Quick Clay와 Quick Sand는 원인이 어떻게 다릅니까?", "a": "**Quick Clay는 구조·화학**의 문제입니다 — 염분 용탈(Leaching)로 카드하우스의 결합력만 사라진 상태에서 교란되면 붕괴합니다. **Quick Sand는 수리**의 문제입니다 — 상향침투로 **유효응력이 0**이 됩니다. 결과는 둘 다 전단강도 상실로 같습니다.", "tag": "인출", "src": "s7"}, {"id": "01-R34", "ch": "제1장 흙의 성질", "sec": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점", "type": "recall", "q": "Quick clay 대책을 발생 3조건에서 끌어내면?", "a": "**조건 하나만 끊으면 됩니다.** ①예민비 → **지반개량(고결·치환)**으로 결합력 회복 ②LI > 1 → **배수·프리로딩**으로 함수비 저감 ③동적하중 → **발파·항타 진동 관리**와 이격거리 확보.", "tag": "인출", "src": "s7"}, {"id": "01-S35", "ch": "제1장 흙의 성질", "sec": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점", "type": "sal", "q": "Leaching 4단계 사슬 — 설명해 보세요", "a": "① 해성 퇴적 **염분 → 이중층 얇음 → 강한 면모(카드하우스)**|\n② 지반 **융기** → ③ 담수 세척 = **Leaching** → 염분 상실|\n④ 이중층 다시 두꺼워짐 → 반발력 부활, **구조는 여전히 카드하우스**|\n   = **결합력을 잃은 카드하우스가 서 있는 상태**, **LI > 1**", "tag": "살", "src": "s7"}, {"id": "01-S36", "ch": "제1장 흙의 성질", "sec": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점", "type": "sal", "q": "Quick Clay vs Quick Sand — 설명해 보세요", "a": "Quick ClayQuick Sand\n**흙**점토(해성)포화 모래\n**원인****Leaching(염분상실)** — 구조·화학**상향침투압 = 유효응력** — 수리\n**메커니즘**카드하우스 결합력 상실 → 교란 시 붕괴i ≥ ic → σ′ = 0 → Boiling\n**판별****St ≥ 8, LI > 1****ic = (Gs−1)/(1+e) = (Gs−1)(1−n)**\n**결과****공통 — 전단강도 상실**", "tag": "갭B", "src": "s7"}, {"id": "01-S37", "ch": "제1장 흙의 성질", "sec": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점", "type": "sal", "q": "답안은 '3조건'으로 쓴다 — 설명해 보세요", "a": "정의만 쓰면 반쪽이다. **발생 3조건(예민비·LI>1·동적하중)**을 쓰면 **대책이 자동으로 따라 나온다** — 조건 하나만 끊으면 되므로 **①지반개량으로 예민비 저감 ②배수로 함수비 저감(LI↓) ③발파·항타 진동 관리**가 대책이 된다. 이게 **정의 → 조건 → 대책**으로 이어지는 답안 구조다.|그리고 백영식의 한마디 — **\"quick의 quick은 강도를 완전히 잃어버린 상태, 즉 흙의 강도가 0인 상태를 의미한다(점토의 움직임이 신속함을 찬양하는 의미가 절대 아님!)\"**", "tag": "살", "src": "s7"}, {"id": "01-T38", "ch": "제1장 흙의 성질", "sec": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점", "type": "table", "q": "예민비 · Quick Clay · 틱소트로피 ★ 필수논점 — 비교표를 채워 보세요 (Quick Clay vs Quick Sand)", "a": "** | Quick Clay | Quick Sand**|| 흙 | 점토(해성) | 포화 모래 ||| 원인 | Leaching(염분상실) — 구조·화학 | 상향침투압 = 유효응력 — 수리 ||| 메커니즘 | 카드하우스 결합력 상실 → 교란 시 붕괴 | i ≥ ic → σ′ = 0 → Boiling ||| 판별 | St ≥ 8, LI > 1 | ic = (Gs−1)/(1+e) = (Gs−1)(1−n) ||| 결과 | 공통 — 전단강도 상실 |", "tag": "비교표", "src": "s7"}, {"id": "01-R39", "ch": "제1장 흙의 성질", "sec": "팽창토와 활성영역 ★ 필수논점", "type": "recall", "q": "팽창토 대책에서 기초를 활성영역 아래로 내리는 이유는?", "a": "활성영역은 **계절적 함수비 변화가 반복되는 심도**라 팽창·수축이 되풀이됩니다. 그 아래는 함수비가 안정적이므로 **체적변화가 기초에 전달되지 않습니다**.", "tag": "인출", "src": "s8"}, {"id": "01-S40", "ch": "제1장 흙의 성질", "sec": "팽창토와 활성영역 ★ 필수논점", "type": "sal", "q": "팽창성토 활성영역, 왜 2단계로 부푸나 — 설명해 보세요", "a": "**1단계 · 간극 채움** — 물이 입자 사이 빈틈을 채움. **부피변화 작음**.|\n**2단계 · 광물 흡수 팽창** — Montmorillonite의 **2:1 층 사이로 물이 들어가 입자 자체가 팽창**. **부피↑↑**\n§02의 **\"Mont는 층 사이에 K⁺가 없고 물을 흡수한다\"**가 여기서 회수됩니다.\n**활성영역(Active Zone)** = **계절 함수비 변화가 반복되는 심도**. 이 안에서는 팽창·수축이 반복되어 기초가 들렸다 내려앉았다 합니다.", "tag": "갭B", "src": "s8"}, {"id": "01-S41", "ch": "제1장 흙의 성질", "sec": "팽창토와 활성영역 ★ 필수논점", "type": "sal", "q": "103-4-3 만점 4덩어리 — 설명해 보세요", "a": "**① 정의·메커니즘** — Montmorillonite 주광물, **A > 1.25**. 팽창은 **간극채움 → 광물흡수** 2단계. **도해 필수**.|\n**② 영향요소 4** — **점토광물 종류 · 흙의 구조 · 함수비 변화 · 상재하중**|\n**③ 시험** — **비구속 팽윤시험 · 팽창압 시험** + 활성도·PI 간접판정|\n**④ 대책 3갈래** — **치환**(제거·비팽창성 치환) / **억제**(석회·시멘트 안정처리) / **차단**(수분침투 방지·배수정비)|\n   + 구조적: **기초를 활성영역 아래로**, **Waffle 기초·Bell Pile** ▲(4권 근거 없음 — 기준서 확인 필요)", "tag": "살", "src": "s8"}, {"id": "01-R42", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "recall", "q": "수중단위중량 식이 3장의 무엇과 같습니까?", "a": "**한계동수경사 ic = (Gs−1)/(1+e)**와 완전히 같은 식입니다. 우연이 아니라, 상향침투에서 **침투압이 흙의 수중무게와 같아지는 순간**이 한계동수경사이기 때문입니다. 1장 삼상관계가 3장 파이핑으로 이어지는 지점입니다.", "tag": "인출", "src": "s9"}, {"id": "01-R43", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "recall", "q": "풍적토(Loess)가 물에 잠기면 갑자기 침하하는 이유는?", "a": "**벌집구조와 겉보기 점착력** 때문입니다. 느슨한 구조를 **모관장력**이 붙들고 있다가, 포화되면 그 장력이 사라져 구조가 무너지며 급격히 침하합니다. 이것이 **붕괴성 지반**입니다.", "tag": "인출", "src": "s9"}, {"id": "01-S44", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "관계식 전부 — 설명해 보세요", "a": "**간극비** e = Vv/Vs  ·  **간극률** n = Vv/V  ·  **n = e/(1+e)**  ·  **e = n/(1−n)**|**함수비** w = Ww/Ws × 100(%)  노건조 110±5℃·24h  ·  **포화도** S = Vw/Vv × 100(%)", "tag": "살", "src": "s9"}, {"id": "01-S45", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "사질토 vs 점성토 하중거동 — 설명해 보세요", "a": "**구분 기준: 75μm(0.075mm, No.200) 체 통과량 50%**\n\n사질토점성토\n**배수조건****배수** — 물이 바로 빠짐**비배수** — 물이 못 빠짐\n**과잉간극수압****미발생****발생** → 유효응력 증가 지연\n**침하**즉시침하(조기·소량)**압밀침하**(장기·대량)\n**강도 지배**내부마찰각 φ (상시)점착력 c (단기 비배수)\n**투수성**큼불량", "tag": "살", "src": "s9"}, {"id": "01-S46", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "흙의 분류·입도분석 — 설명해 보세요", "a": "**Stokes** v = (γs−γw)/(18η) · d²  침강속도 ∝ 입경². 조건: 구형·저속·간섭無 / 실제는 응집→입경 과대평가", "tag": "갭B", "src": "s9"}, {"id": "01-S47", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "이인모가 직접 못박은 두 줄 — 설명해 보세요", "a": "**Note ①** — \"토질역학의 수식에서 **1 + e 항이 있으면 전체적(全體積)**으로 생각하면 된다.\" 이 한 줄만 알아도 압밀·다짐 공식이 전부 읽힌다.|**Note ②** — \"**Se = wGs** 식은 부피를 무게로 바꿀 때(또는 무게를 부피로 바꿀 때) 유용하게 사용되는 식이므로 **외워두길 바란다**.\"", "tag": "살", "src": "s9"}, {"id": "01-S48", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "벌집구조가 Bulking이고 붕괴성 지반이다 — 설명해 보세요", "a": "이 현상이 **Bulking**이며, 다짐곡선에서 **모래에 함수비를 조금 줬을 때 오히려 γd가 떨어지는 구간**의 원인이다. 실무 함의는 **겉보기 점착력(apparent cohesion)** — 젖은 모래로 성을 쌓을 수 있는 이유다. 그 물이 마르거나 **완전히 포화되면 표면장력이 사라져 구조가 붕괴**한다. 이것이 **붕괴성 지반(collapsible soil)**의 메커니즘이고, 풍적토(Loess)가 물에 잠기면 급격히 침하하는 이유다.", "tag": "살", "src": "s9"}, {"id": "01-S49", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "이것이 e-log P 곡선의 존재 이유다 — 설명해 보세요", "a": "압밀시험 결과를 **왜 e-log P로 그리는가**에 대한 답이 여기 있다. **흙입자 부피가 불변**이므로 e만 추적하면 체적변화 전부를 표현할 수 있고, **침하량 = (Δe / (1+e₀)) × H** 라는 압밀침하 공식이 바로 여기서 나온다. **분모의 (1+e₀)가 곧 초기 전체 부피**다.|1장에서 \"e를 쓴다\"는 약속 하나가 **4장 압밀의 기본식**으로 곧장 이어진다.", "tag": "살", "src": "s9"}, {"id": "01-S50", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "sal", "q": "대표치를 외워두라는 이유 — 설명해 보세요", "a": "백영식은 **대표치(typical value)**를 반복해서 제시하며 외우라고 한다. 이유는 **약산과 검산**이다 — 시험장에서 계산 결과가 대표치를 크게 벗어나면 **계산이 틀렸거나 특수한 지반**이다. 즉 **스스로 검산하는 장치**가 된다.|**모래 e = 0.5~0.8 · 점성토 e = 0.7~1.1** · 일반 **w < 60%**, 해성·유기질 점토는 **w = 300~400%**도 가능 · **Gs = 2.65~2.72**(모래 2.65) · **γw = 9.81 kN/m³**", "tag": "살", "src": "s9"}, {"id": "01-T51", "ch": "제1장 흙의 성질", "sec": "삼상관계 — 관계식 한 판", "type": "table", "q": "삼상관계 — 관계식 한 판 — 비교표를 채워 보세요 (사질토 vs 점성토)", "a": "** | 사질토 | 점성토**|| 배수조건 | 배수 — 물이 바로 빠짐 | 비배수 — 물이 못 빠짐 ||| 과잉간극수압 | 미발생 | 발생 → 유효응력 증가 지연 ||| 침하 | 즉시침하(조기·소량) | 압밀침하(장기·대량) ||| 강도 지배 | 내부마찰각 φ (상시) | 점착력 c (단기 비배수) ||| 투수성 | 큼 | 불량 |", "tag": "비교표", "src": "s9"}, {"id": "01-R52", "ch": "제1장 흙의 성질", "sec": "통일분류법 상세 — 문자 두 개가 정해지는 규칙", "type": "recall", "q": "#200 통과가 8%인 모래입니다. 기호를 어떻게 붙입니까?", "a": "**5~12% 구간이므로 이중기호**를 씁니다. 앞은 Cu·Cc로 SW인지 SP인지 정하고, 뒤는 소성도로 M인지 C인지 정해서 **SW-SM**처럼 붙입니다.", "tag": "인출", "src": "sUC"}, {"id": "01-S53", "ch": "제1장 흙의 성질", "sec": "통일분류법 상세 — 문자 두 개가 정해지는 규칙", "type": "sal", "q": "자주 틀리는 자리 : 4 vs 6 — 설명해 보세요", "a": "**자갈 GW는 Cu ≥ 4**, **모래 SW는 Cu ≥ 6**. 자갈이 모래보다 기준이 **느슨한** 이유는 자갈 자체가 입경 범위가 넓어 균등계수가 크게 나오기 쉽기 때문이다. **곡률계수는 둘 다 1 < Cc < 3**으로 같다.", "tag": "살", "src": "sUC"}, {"id": "01-S54", "ch": "제1장 흙의 성질", "sec": "통일분류법 상세 — 문자 두 개가 정해지는 규칙", "type": "sal", "q": "분류 3단계 — 설명해 보세요", "a": "①**#200 통과량 F**를 구해 **50%** 기준으로 조립·세립 판정 →\n②조립토면 조립분에 대한 **#4 통과량**으로 자갈·모래 구분 후 **Cu·Cc 또는 소성도**로 뒷글자 결정 →\n③세립토면 **소성도표**로 바로 기호 결정. 유기질은 **노건조 LL 비**, 이탄은 **육안**.", "tag": "골격", "src": "sUC"}, {"id": "01-S55", "ch": "제1장 흙의 성질", "sec": "통일분류법 상세 — 문자 두 개가 정해지는 규칙", "type": "sal", "q": "양입도가 왜 좋은가 — 설명해 보세요", "a": "입자 크기가 고르게 섞이면 **작은 입자가 큰 입자 사이 간극을 메워** 최대건조밀도↑ · **다짐 효율↑ · 전단강도↑ · 지지력↑ · 투수계수↓ · 침하↓**.\n빈입도(균등입도)는 반대로 간극이 커서 **액상화에도 취약**하다. 그래서 **필터재·뒤채움재는 양입도**를 요구한다.", "tag": "살", "src": "sUC"}, {"id": "01-T56", "ch": "제1장 흙의 성질", "sec": "통일분류법 상세 — 문자 두 개가 정해지는 규칙", "type": "table", "q": "통일분류법 상세 — 문자 두 개가 정해지는 규칙 — 비교표를 채워 보세요 (기호)", "a": "**기호 | 조건 (이인모 표 3.1~3.2)**|| GW | #200 < 5%, Cu ≥ 4 and 1 < Cc < 3 ||| GP | #200 < 5%, GW 기준과 일치하지 않을 때 ||| SW | #200 < 5%, Cu ≥ 6 and 1 < Cc < 3 ||| SP | #200 < 5%, SW 기준과 일치하지 않을 때 ||| GM · SM | #200 > 12%, A선 아래이거나 PI < 4 ||| GC · SC | #200 > 12%, A선 위이고 PI > 7 ||| GC-GM · SC-SM | #200 > 12%, 소성도의 CL-ML 빗금 영역 ||| GW-GM 등 | #200 5~12% : 앞 기준 + 뒤 기준 이중기호 |", "tag": "비교표", "src": "sUC"}, {"id": "01-T57", "ch": "제1장 흙의 성질", "sec": "통일분류법 상세 — 문자 두 개가 정해지는 규칙", "type": "table", "q": "통일분류법 상세 — 문자 두 개가 정해지는 규칙 — 비교표를 채워 보세요 (기호)", "a": "**기호 | 조건 (이인모 표 3.3 · 세립토)**|| CL | 무기질, LL < 50, PI > 7, A선 선상 또는 위 ||| ML | 무기질, LL < 50, PI < 4 또는 A선 아래 ||| OL | 유기질, LL < 50, (LL 노건조/LL 비건조) < 0.75 ||| CH | 무기질, LL ≥ 50, A선 선상 또는 위 ||| MH | 무기질, LL ≥ 50, A선 아래 ||| OH | 유기질, LL ≥ 50, (LL 노건조/LL 비건조) < 0.75 ||| CL-ML | A선 부근 · PI 4~7 빗금 영역 (이중기호) ||| Pt | 이탄 — 유기질이 대단히 많은 흙, 육안 관찰로 판별 |", "tag": "비교표", "src": "sUC"}, {"id": "01-R58", "ch": "제1장 흙의 성질", "sec": "군지수와 AASHTO — 노상토 적부를 숫자 하나로", "type": "recall", "q": "통일분류와 AASHTO를 한 문장으로 구분하면?", "a": "**통일분류는 구조물 기초용, AASHTO는 도로 노상토용**입니다. 그래서 통일분류는 **#200 50%**로 갈라 공학적 거동을 보고, AASHTO는 **#200 35%**로 갈라 **군지수 하나로 노상토 적부**를 판정합니다.", "tag": "인출", "src": "sGI"}, {"id": "01-S59", "ch": "제1장 흙의 성질", "sec": "군지수와 AASHTO — 노상토 적부를 숫자 하나로", "type": "sal", "q": "50%가 아니라 35% — 설명해 보세요", "a": "**조·세립토 구분 기준이 #200 통과 35%**다. 통일분류의 50%와 다르며, 이인모가 **\"큰 줄기의 하나\"**라고 강조한 지점이다.|조립토 **A-1~A-3**(#200 ≤ 35%) · 세립토 **A-4~A-7**(#200 > 35%)", "tag": "살", "src": "sGI"}, {"id": "01-S60", "ch": "제1장 흙의 성질", "sec": "군지수와 AASHTO — 노상토 적부를 숫자 하나로", "type": "sal", "q": "식의 의미를 읽는다 — 설명해 보세요", "a": "**GI는 작을수록 양질**이며 음수면 **0으로 본다(GI ≥ 0)**. 노상토 등급은 **A-1~A-3 아주 우수·우수**, **A-4~A-7 중간·나쁨**.|\n식을 보면 **세립분(a·b)·액성한계(c)·소성지수(d)가 커질수록 GI가 커진다** — **세립이 많고 소성이 클수록 노상토로 나쁘다**는 상식을 숫자 하나로 만든 것이다.", "tag": "살", "src": "sGI"}, {"id": "01-S61", "ch": "제1장 흙의 성질", "sec": "에이징 — 시간이 흙을 과압밀로 만든다", "type": "sal", "q": "에이징 — 설명해 보세요", "a": "퇴적 후 시간이 지나며 **Creep·2차압밀로 간극비가 감소**해, 하중이 늘지 않았는데도 **과압밀처럼 거동**하게 되는 현상. 이때 생기는 것이 **지연압축·유사선행압밀하중(준선행압밀하중)**이고 **OCR = Pc/Po > 1**이 된다.", "tag": "살", "src": "sAG"}, {"id": "01-S62", "ch": "제1장 흙의 성질", "sec": "에이징 — 시간이 흙을 과압밀로 만든다", "type": "sal", "q": "왜 위험한가 — 설명해 보세요", "a": "압밀시험으로 구한 선행압밀하중이 **실제 하중 이력이 아니라 시간효과**일 수 있다. 이걸 모르고 과압밀로 판단하면 **침하량을 과소평가**한다. 성토하중이 그 유사선행압밀하중을 넘는 순간 **정규압밀 거동으로 급전환**되기 때문이다.", "tag": "살", "src": "sAG"}, {"id": "01-S63", "ch": "제1장 흙의 성질", "sec": "실제 기출 — 개념 묶음별 (중복 묶고 + 넣을 것)", "type": "sal", "q": "G1 · 점토광물 · 동형치환 · 판별법 — 설명해 보세요", "a": "**대표 기출 — 128회 1교시 3번**\n🖼️ **기호도** — 사다리꼴(Silica sheet)·직사각형(Gibbsite sheet) 쌓기\n🔧 **3종 층간결합** — Kaolinite 1:1 **수소결합** / Illite 2:1 **K⁺** / Montmorillonite 2:1 **nH₂O+치환성 양이온**\n🔢 **비표면적 15 / 80 / 800 m²/g** ← 이 숫자가 활성도·팽창성·예민비를 전부 설명\n🔢 **A = PI ÷ 2μm 통과율**, 경계 **0.75 · 1.25**\n🔧 **판별** — 간편=활성도·소성도 / 정밀=**XRD·SEM**\n⚖ 종류 나열만 = 중간. **구조비·층간결합·표면적·안정성 4칸 비교표** = 만점\n**같은 개념 (따로 안 써도 됨)** — **119**회 4교시 4번 점토광물 기본구조·2층/3층 구조 · **95**회 1교시 2   var other = a.filter(function(c){ return c.sec !== lastSec; });
  return rnd(other.length ? other : a);
}
function pick(){
  var p = pool();
  var d = p.filter(due);
  var f = p.filter(fresh);
  var r = p.filter(function(c){ return !done(c) && !due(c) && !fresh(c); });
  /* 복습이 밀리면 먼저 턴다. 아니면 복습:새것 = 1:2 로 섞는다 */
  if(d.length >= 8) return cross(d);
  if(d.length && f.length) return cross(Math.random() < 0.34 ? d : f);
  if(d.length) return cross(d);
  if(f.length) return cross(f);
  if(r.length) return cross(r);
  return null;
}

function fmtAns(a){
  if(a.indexOf('|') >= 0 && a.split('|').length > 3){
    var parts = a.split('|').filter(function(x){ return x.trim(); });
    var isTbl = parts.filter(function(x){ return x.indexOf('  ')>=0 || x.split(' | ').length>1; }).length > 1;
    if(a.indexOf('**') === 0 && parts.length > 2){
      var rows = a.split('||').filter(function(x){return x.trim();});
      var out = '<table>';
      rows.forEach(function(r){
        var cs = r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){return x.trim();}).filter(function(x){return x;});
        if(!cs.length) return;
        out += '<tr>' + cs.map(function(x){ return '<td>'+bold(x)+'</td>'; }).join('') + '</tr>';
      });
      return out + '</table>';
    }
    return parts.map(function(x){ return '<div class="ln">'+bold(x.trim())+'</div>'; }).join('');
  }
  return '<div class="ln">'+bold(a)+'</div>';
}
function bold(x){
  return x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*/g,'');
}

function render(){
  var el = document.getElementById('stage');
  cur = pick(); shown = false;
  if(tmr){ clearInterval(tmr); tmr=null; }
  if(!cur){
    el.innerHTML = '<div class="card done"><h2>이 범위는 다 끝냈습니다</h2>'
      + '<p>필터를 바꾸거나, 복습 예정일에 다시 오십시오.</p>'
      + '<div class="acts"><button class="show" onclick="resetFilter()">전체 보기</button></div></div>';
    stats(); return;
  }
  var bc = {'인출':'b-t','살':'b-s','골격':'b-g','비교표':'b-c','갭B':'b-n'}[cur.tag] || 'b-n';
  var v = st(cur.id);
  var mark = v ? (v.s==='x' ? '<span class="bdg b-s">복습</span>' : (v.n ? '<span class="bdg b-c">확인</span>' : '')) : '';
  el.innerHTML =
    '<div class="card">'
    + '<div class="meta"><span class="bdg '+bc+'">'+cur.tag+'</span>'
    + '<span class="bdg b-n">'+cur.sec+'</span>'+mark
    + '<span class="hint" style="margin-left:auto">'+cur.id+'</span></div>'
    + '<p class="q">'+cur.q+'</p>'
    + '<p class="hint">소리 내어 답해 보세요. 막혀도 버티는 게 효과입니다.</p>'
    + '<div class="timer" id="tm">3</div>'
    + '<div id="ans"></div>'
    + '<div class="acts" id="acts">'
    +   '<button class="show" onclick="reveal()">답 보기 <span class="kb">(Space)</span></button>'
    +   '<button class="skip" onclick="render()">건너뛰기</button>'
    + '</div></div>';
  left = 3;
  tmr = setInterval(function(){
    left--;
    var t = document.getElementById('tm');
    if(!t){ clearInterval(tmr); return; }
    if(left > 0){ t.textContent = left; }
    else { t.textContent = '지금 답하세요'; t.classList.add('go'); t.style.fontSize='1.2rem'; clearInterval(tmr); tmr=null; }
  }, 1000);
  stats();
}

function reveal(){
  if(shown || !cur) return;
  shown = true;
  if(tmr){ clearInterval(tmr); tmr=null; }
  var t=document.getElementById('tm'); if(t) t.style.display='none';
  document.getElementById('ans').innerHTML = '<div class="a">'+fmtAns(cur.a)+'</div>';
  document.getElementById('acts').innerHTML =
      '<button class="ok" onclick="mark(2)">막힘없이 <span class="kb">(1)</span></button>'
    + '<button class="mid" onclick="mark(1)">겨우 떠올림 <span class="kb">(2)</span></button>'
    + '<button class="ng" onclick="mark(0)">못 했다 <span class="kb">(3)</span></button>';
}

/* g=2 막힘없이 / g=1 겨우 / g=0 못 함
   "겨우 떠올림"을 따로 둔 이유 — 읽으면 아는 것 같은 유창성 착각을 걸러내기 위함.
   막힘없이 답한 것만 간격을 늘린다. */
function mark(g){
  if(!cur) return;
  var v = st(cur.id) || {i:-1, w:0};
  var i = (typeof v.i === 'number') ? v.i : -1;
  if(g === 0){ i = -1; }                          /* 못 했다 → 처음으로 */
  else if(g === 1){ i = Math.max(0, i); }         /* 겨우   → 간격 유지 */
  else { i = Math.min(i + 1, STEPS.length - 1); } /* 막힘없이 → 다음 간격 */
  var nx = plus(STEPS[Math.max(0, i)]);
  var fin = (g === 2 && i >= STEPS.length - 1);   /* 21일까지 통과 = 완료 */
  S[cur.id] = { s:(g===0?'x':'o'), n:(fin?null:nx), i:i, w:(g===0?1:(v.w||0)) };
  lastSec = cur.sec; sessN++;
  save(); render();
}

function stats(){
  var p = pool();
  var nd = p.filter(done).length, ndue = p.filter(due).length, nf = p.filter(fresh).length;
  document.getElementById('st').textContent = nd + ' / ' + p.length + ' 완료';
  document.getElementById('pb').style.width = (p.length ? nd/p.length*100 : 0) + '%';
  document.getElementById('cnt').textContent =
    '이번 세션 ' + sessN + '장 · 새 카드 ' + nf + ' · 복습 ' + ndue + ' · 남음 ' + (p.length - nd);
}

function resetFilter(){
  fSec=''; fTag='';
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  document.querySelector('.chip[data-v=""][data-f="sec"]').classList.add('on');
  document.querySelector('.chip[data-v=""][data-f="tag"]').classList.add('on');
  render();
}
function resetAll(){
  if(!confirm('학습 기록을 모두 지웁니다. 계속할까요?')) return;
  S = {}; save(); render();
}

document.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if(!shown) reveal(); }
  else if(e.key === '1' && shown) mark(2);
  else if(e.key === '2' && shown) mark(1);
  else if(e.key === '3' && shown) mark(0);
  else if(e.key === 'n' || e.key === 'N') render();
});

window.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){
      var f = c.dataset.f;
      document.querySelectorAll('.chip[data-f="'+f+'"]').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');
      if(f === 'sec') fSec = c.dataset.v; else fTag = c.dataset.v;
      render();
    };
  });
  render();
});
